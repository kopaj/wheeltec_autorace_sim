pure_pursuit_controller:
  ros__parameters:
    enabled_on_start: false
    wheel_base_m: 0.3187       # Matches corrected SDF and actual axle positions.
    steering_limit_rad: 0.4  # Unchanged Fortress SDF limit (sin convention).
    max_linear_speed: 0.85
    preview_speed: 0.32     # Limit at RAW preview score 1.
    preview_activation_score: 0.50  # Ignore weak/distant evidence; linear ramp above this.
    degraded_speed: 0.25
    max_lateral_acceleration: 0.25  # m/s^2, steady-state curve speed budget.
    max_acceleration: 0.18   # m/s^2, gradual start and exit from turns.
    max_deceleration: 0.2    # m/s^2, one normal-operation speed limiter.
    perception_timeout_sec: 0.30
    control_frequency_hz: 40.0
