pid_lane_controller:
  ros__parameters:

    # ROS interfaces
    error_topic: "/lane_detection/control_error_normalized"
    valid_topic: "/lane_detection/valid"
    degraded_topic: "/lane_detection/degraded"
    cmd_vel_topic: "/cmd_vel"
    turn_preview_topic: "/lane_detection/turn_preview"
    current_speed_topic: "/control/pid/current_speed"

    enabled_on_start: false
    perception_timeout_sec: 0.30
    control_frequency_hz: 40.0

    # Keep the tested PID steering gains unchanged.
    kp: 1.70
    ki: 0.0
    kd: 0.28
    integral_limit: 0.40
    derivative_filter_alpha: 0.18

    # Mild low-pass filtering of the image-space error.
    error_filter_alpha: 0.40
    error_deadband: 0.012

    # Error limiting.
    normal_error_limit: 0.45
    degraded_error_limit: 0.25
    degraded_kp_scale: 0.60

    # Stable vehicle limits.
    max_angular_z: 0.70
    degraded_max_angular_z: 0.40
    max_linear_speed: 0.85
    min_linear_speed: 0.25
    degraded_linear_speed: 0.25
    steering_sign: -1.0

    # Anticipatory speed cap; does not enter the PID steering calculation.
    use_turn_preview: true
    preview_speed: 0.30
    preview_activation_score: 0.55
    preview_timeout_sec: 0.30  # Receipt age in steady/wall time.

    # Previously hard-coded command ramps, now configurable. Same time base
    # and defaults as the working PID; these are NOT measured vehicle accelerations.
    max_acceleration: 0.30
    max_deceleration: 1.50

    # Steering slew limiter.
    steering_rise_rate: 4.0
    steering_center_rate: 5.0
    steering_reverse_rate: 1.4

    # Keep recovery disabled in the stable baseline.
    recovery_enabled: false
    recovery_timeout_sec: 0.60
    recovery_entry_grace_sec: 0.25
    recovery_entry_error: 0.10
    recovery_entry_angular_z: 0.20
    recovery_linear_speed: 0.025
    recovery_angular_z: 0.35

    # Debug topics
    p_term_topic: "/control/pid/p_term"
    i_term_topic: "/control/pid/i_term"
    d_term_topic: "/control/pid/d_term"
    output_topic: "/control/pid/output"
    active_topic: "/control/pid/active"
    recovery_active_topic: "/control/pid/recovery_active"
