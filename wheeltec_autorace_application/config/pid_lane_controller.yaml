pid_lane_controller:
  ros__parameters:

    # ROS interfaces
    error_topic: "/lane_detection/control_error_normalized"
    valid_topic: "/lane_detection/valid"
    degraded_topic: "/lane_detection/degraded"
    cmd_vel_topic: "/cmd_vel"

    enabled_on_start: false
    perception_timeout_sec: 0.25
    control_frequency_hz: 20.0

    # PID. Lower P than before; slightly stronger D damping.
    kp: 1.65
    ki: 0.0
    kd: 0.18
    integral_limit: 0.40
    derivative_filter_alpha: 0.15

    # Mild low-pass filtering of the image-space error.
    error_filter_alpha: 0.30
    error_deadband: 0.018

    # Do not let a momentary BEV / estimated-lane error drive the Ackermann
    # steering directly to saturation.
    normal_error_limit: 0.45
    degraded_error_limit: 0.30
    degraded_kp_scale: 0.70

    # Vehicle limits. The controller starts steering a little earlier via the
    # perception lookahead, so it no longer needs a very large late command.
    max_angular_z: 0.70
    degraded_max_angular_z: 0.45
    max_linear_speed: 0.2
    min_linear_speed: 0.12
    degraded_linear_speed: 0.08
    steering_sign: -1.0

    # Steering slew limiter.
    # - rise: enter a corner reasonably quickly
    # - center: unwind steering quickly when the corner ends
    # - reverse: prevent an immediate large command to the opposite side
    steering_rise_rate: 2.8
    steering_center_rate: 4.0
    steering_reverse_rate: 1.2

    # Disabled for this tuning step. The previous fixed-angle recovery could
    # amplify an overshoot and start the left-right snake motion.
    recovery_enabled: false
    recovery_timeout_sec: 0.60
    recovery_entry_grace_sec: 0.25
    recovery_entry_error: 0.10
    recovery_entry_angular_z: 0.20
    recovery_linear_speed: 0.025
    recovery_angular_z: 0.35

    # Debug topics
    p_term_topic: "/control/pid/p_term"
    i_term_topic: "/control/pid/i_term"
    d_term_topic: "/control/pid/d_term"
    output_topic: "/control/pid/output"
    active_topic: "/control/pid/active"
    recovery_active_topic: "/control/pid/recovery_active"
